pluginManagement {
    repositories {
        maven {
            // RetroFuturaGradle lives here
            name 'GTNH Maven'
            url 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroupByRegex 'com\\.gtnewhorizons\\..+'
            }
        }
        gradlePluginPortal()
        mavenCentral()
        mavenLocal()
    }
}

plugins {
    // Automatic JDK toolchain provisioning (Java 8 for both MC versions)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'RetroForgeTemplate'

// Shared, version-agnostic code
include 'core'
// Per-Minecraft-version modules (each applies RetroFuturaGradle independently)
include '1710'
include '1122'
