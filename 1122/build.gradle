plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

def modId = project.findProperty('mod_id') ?: 'retroforge'
def mixinConfig = "mixins.${modId}.json"
def mixinRefMap = "mixins.${modId}.refmap.json"

base {
    archivesName = "${modId}-mc1.12.2"
}

// --- Minecraft 1.12.2 (net.minecraftforge.fml, Forge 14.23.x) ----------------
minecraft {
    mcVersion.set('1.12.2')

    // 1.12.2 needs explicit MCP mappings (unlike 1.7.10).
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')

    username.set('Developer')

    extraRunJvmArguments.addAll([
            '-ea:' + project.group,
            // Handy while developing mixins; safe to remove.
            '-Dmixin.debug.export=true'
    ])
}

repositories {
    // MixinBooter (zone.rong:mixinbooter) lives here.
    maven {
        name 'CleanroomMC Maven'
        url 'https://maven.cleanroommc.com'
    }
}

dependencies {
    // Version-agnostic shared code.
    implementation project(':core')

    // Mixin via MixinBooter. enableMixins() only wires refmap generation +
    // reobfuscation; the dependency itself is declared here. MixinBooter
    // bundles the SpongePowered Mixin library and its annotation processor.
    String mixin = modUtils.enableMixins('zone.rong:mixinbooter:11.13', mixinRefMap)
    implementation(mixin) {
        transitive = false
    }
    annotationProcessor mixin
}

// Make sure :core is configured before we read its outputs below.
evaluationDependsOn(':core')

// Embed the compiled core classes into the mod jar so the shipped mod is
// self-contained.
jar {
    from { project(':core').sourceSets.main.output }

    // MixinBooter reads this manifest attribute to discover the mixin config.
    manifest {
        attributes 'MixinConfigs': mixinConfig
    }
}

// Fill mcmod.info / pack.mcmeta placeholders from gradle.properties.
processResources {
    def tokens = [
            mod_id         : modId,
            mod_name       : project.findProperty('mod_name'),
            mod_version    : project.version.toString(),
            mod_description: project.findProperty('mod_description'),
            mod_authors    : project.findProperty('mod_authors')
    ]
    inputs.properties(tokens)
    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand(tokens)
    }
}
