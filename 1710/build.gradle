plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

base {
    archivesName = "${project.findProperty('mod_id')}-mc1.7.10"
}

// --- Minecraft 1.7.10 (cpw.mods.fml, Forge 10.13.x) --------------------------
// RetroFuturaGradle handles the Forge version and MCP mappings internally for
// 1.7.10, so we only declare the MC version and the dev username.
minecraft {
    mcVersion.set('1.7.10')
    username.set('Developer')

    // Assertions for our own classes during dev runs.
    extraRunJvmArguments.add('-ea:' + project.group)
}

dependencies {
    // Version-agnostic shared code.
    implementation project(':core')
}

// Make sure :core is configured before we read its outputs below.
evaluationDependsOn(':core')

// Embed the compiled core classes into the mod jar so the shipped mod is
// self-contained. core has no Minecraft references, so reobfuscation leaves
// these classes untouched.
jar {
    from { project(':core').sourceSets.main.output }
}

// Fill mcmod.info placeholders from gradle.properties.
processResources {
    def tokens = [
            mod_id         : project.findProperty('mod_id'),
            mod_name       : project.findProperty('mod_name'),
            mod_version    : project.version.toString(),
            mod_description: project.findProperty('mod_description'),
            mod_authors    : project.findProperty('mod_authors')
    ]
    inputs.properties(tokens)
    filesMatching('mcmod.info') {
        expand(tokens)
    }
}
